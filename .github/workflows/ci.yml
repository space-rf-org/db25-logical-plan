name: CI

# Build and test the DB25 logical-plan / binder on every push and pull request.
# The parser and semantic analyzer are consumed as git submodules under
# external/ (with the parser's SIMD tokenizer as a recursive sub-submodule), so
# the checkout must be recursive. No separate dependency install is needed: the
# top-level CMake builds the parser in-tree and compiles the analyzer sources
# directly (see CMakeLists.txt).
on:
  push:
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Standard build + test against the pinned submodules.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: build-and-test (g++-14)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install g++-14
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Same recipe under AddressSanitizer + UndefinedBehaviorSanitizer. The
  # sanitizer flags apply to every translation unit built in-tree (binder +
  # parser + analyzer sources), so this exercises the whole pipeline for memory
  # and UB errors.
  # ---------------------------------------------------------------------------
  sanitizers:
    name: sanitizers (asan+ubsan)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install g++-14
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14

      - name: Configure (asan+ubsan)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build (asan+ubsan)
        run: cmake --build build -j"$(nproc)"

      - name: Test (asan+ubsan)
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  falsifiability:
    name: falsifiability gate (g++-14)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (recursive)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install g++-14
        run: |
          if command -v g++-14 >/dev/null 2>&1; then
            echo "g++-14 already present: $(g++-14 --version | head -1)"
          else
            sudo apt-get update
            sudo apt-get install -y g++-14
          fi

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14

      # A gate that has never been seen to fail is not known to be a gate. This
      # injects a comment edit, which no assertion can detect, and REQUIRES the
      # gate to report it as surviving.
      - name: Self-test (the gate must be able to fail)
        run: python3 tools/falsifiability.py --self-test --build-dir build

      # Each mutant removes one behaviour - an optimizer pass, the order they run
      # in, or one of the binder's schema guarantees - and must be caught.
      - name: Falsifiability gate
        run: python3 tools/falsifiability.py --build-dir build

  # ---------------------------------------------------------------------------
  # Line coverage for THIS repository, recomputed every run against a recorded
  # baseline. Each repo measures itself: the same files read very differently
  # from the umbrella's suite, which exercises the query path and builds this
  # repo for its own purposes. A ratchet on one total, not per-file targets.
  #
  # Coverage is what was REACHED, never what was CHECKED - the falsifiability
  # gate above is what decides whether reaching a line means anything.
  # ---------------------------------------------------------------------------
  coverage:
    name: line coverage (ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install compiler
        run: |
          if command -v g++-14 >/dev/null 2>&1; then
            echo "g++-14 already present: $(g++-14 --version | head -1)"
          else
            sudo apt-get update
            sudo apt-get install -y g++-14
          fi

      - name: Coverage
        run: ./scripts/coverage.sh build-coverage
